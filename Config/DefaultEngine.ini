[/Script/EngineSettings.GameMapsSettings]
; The game builds its whole presentation (3D stage, Slate UI, procedural audio) in C++, so the
; engine's empty Entry map is all it needs. No content assets are required.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Amplitude.AmplitudeGameMode

[/Script/Engine.Engine]
